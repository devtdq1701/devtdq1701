<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="850" height="260">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0D1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FF007F" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Text Horizontal Gradient (White -> Cyan -> Pink) -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#00F0FF"/>
      <stop offset="90%" stop-color="#FF007F"/>
    </linearGradient>

    <!-- Cube 1 (Large Cyan/Purple) Gradients -->
    <linearGradient id="cubeTop1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>
    <linearGradient id="cubeLeft1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0077B6"/>
      <stop offset="100%" stop-color="#023E8A"/>
    </linearGradient>
    <linearGradient id="cubeRight1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#03045E"/>
      <stop offset="100%" stop-color="#001233"/>
    </linearGradient>

    <!-- Cube 2 (Medium Pink) Gradients -->
    <linearGradient id="cubeTop2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#FF758C"/>
    </linearGradient>
    <linearGradient id="cubeLeft2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B5179E"/>
      <stop offset="100%" stop-color="#7209B7"/>
    </linearGradient>
    <linearGradient id="cubeRight2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#560BAD"/>
      <stop offset="100%" stop-color="#3A0CA3"/>
    </linearGradient>

    <!-- Cube 3 (Small Green) Gradients -->
    <linearGradient id="cubeTop3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <linearGradient id="cubeLeft3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="cubeRight3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <radialGradient id="ambientGlow" cx="72%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#FF007F" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .cls-bg { fill: url(#bgGrad); rx: 16px; }
    .cls-border { fill: none; stroke: url(#borderGrad); stroke-width: 1.5; rx: 16px; }
    .cls-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 32px; fill: url(#textGrad); letter-spacing: -0.5px; }
    .cls-sub { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #94A3B8; }
    .cls-badge-bg { fill: rgba(0, 240, 255, 0.08); stroke: rgba(0, 240, 255, 0.5); stroke-width: 1; rx: 13px; }
    .cls-badge-text { font-family: monospace; font-size: 11px; font-weight: 700; fill: #00F0FF; letter-spacing: 1.2px; }
    .cls-pill-bg { fill: #131E32; stroke-width: 1; rx: 6px; }
    .cls-pill-text { font-family: monospace; font-size: 11px; font-weight: 600; }
    
    @keyframes float1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(10px); }
    }
    @keyframes float3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .anim-float1 { animation: float1 4s ease-in-out infinite; }
    .anim-float2 { animation: float2 3.5s ease-in-out infinite; }
    .anim-float3 { animation: float3 4.5s ease-in-out infinite; }
    .anim-dot { animation: pulseDot 1.5s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="850" height="260" class="cls-bg"/>
  <rect width="850" height="260" fill="url(#ambientGlow)"/>

  <!-- 3D Perspective Grid Floor -->
  <g stroke="#00F0FF" stroke-opacity="0.14" stroke-width="1">
    <line x1="425" y1="120" x2="0" y2="260"/>
    <line x1="425" y1="120" x2="100" y2="260"/>
    <line x1="425" y1="120" x2="200" y2="260"/>
    <line x1="425" y1="120" x2="300" y2="260"/>
    <line x1="425" y1="120" x2="400" y2="260"/>
    <line x1="425" y1="120" x2="500" y2="260"/>
    <line x1="425" y1="120" x2="600" y2="260"/>
    <line x1="425" y1="120" x2="700" y2="260"/>
    <line x1="425" y1="120" x2="800" y2="260"/>
    <line x1="425" y1="120" x2="850" y2="260"/>
    
    <line x1="300" y1="150" x2="550" y2="150"/>
    <line x1="200" y1="180" x2="650" y2="180"/>
    <line x1="100" y1="215" x2="750" y2="215"/>
    <line x1="0" y1="255" x2="850" y2="255"/>
  </g>

  <!-- 3D Isometric Floating Cube 1 (Large Cyan/Purple) -->
  <g class="anim-float1">
    <g transform="translate(670, 50)">
      <!-- Top Face -->
      <polygon points="50,10 90,32 50,54 10,32" fill="url(#cubeTop1)"/>
      <!-- Left Face -->
      <polygon points="10,32 50,54 50,105 10,83" fill="url(#cubeLeft1)"/>
      <!-- Right Face -->
      <polygon points="50,54 90,32 90,83 50,105" fill="url(#cubeRight1)"/>
      <!-- Glowing Core Node -->
      <circle cx="50" cy="54" r="5" fill="#00F0FF" opacity="0.9"/>
    </g>
  </g>

  <!-- 3D Isometric Floating Cube 2 (Medium Pink) -->
  <g class="anim-float2">
    <g transform="translate(575, 115)">
      <!-- Top Face -->
      <polygon points="35,7 63,22 35,38 7,22" fill="url(#cubeTop2)"/>
      <!-- Left Face -->
      <polygon points="7,22 35,38 35,74 7,58" fill="url(#cubeLeft2)"/>
      <!-- Right Face -->
      <polygon points="35,38 63,22 63,58 35,74" fill="url(#cubeRight2)"/>
    </g>
  </g>

  <!-- 3D Isometric Floating Cube 3 (Small Green) -->
  <g class="anim-float3">
    <g transform="translate(520, 65)">
      <!-- Top Face -->
      <polygon points="25,5 45,16 25,27 5,16" fill="url(#cubeTop3)"/>
      <!-- Left Face -->
      <polygon points="5,16 25,27 25,52 5,41" fill="url(#cubeLeft3)"/>
      <!-- Right Face -->
      <polygon points="25,27 45,16 45,41 25,52" fill="url(#cubeRight3)"/>
    </g>
  </g>

  <!-- Left Content: Status Badge -->
  <rect x="45" y="30" width="180" height="26" class="cls-badge-bg"/>
  <circle cx="60" cy="43" r="3.5" fill="#22C55E" class="anim-dot"/>
  <text x="72" y="47" class="cls-badge-text">SYSADMIN @ WORK</text>

  <!-- Left Content: Name & Title -->
  <text x="45" y="96" class="cls-title">TRẦN ĐĂNG QUANG</text>
  <text x="45" y="123" class="cls-sub">Linux &amp; System Administrator | Automation &amp; DevOps Enthusiast</text>

  <!-- Left Content: Tech Badges / Pills -->
  <g transform="translate(45, 145)">
    <!-- Pill 1: Linux -->
    <rect x="0" y="0" width="75" height="26" class="cls-pill-bg" stroke="#00F0FF"/>
    <text x="12" y="17" class="cls-pill-text" fill="#00F0FF">#Linux</text>

    <!-- Pill 2: Docker -->
    <rect x="85" y="0" width="80" height="26" class="cls-pill-bg" stroke="#FF007F"/>
    <text x="97" y="17" class="cls-pill-text" fill="#FF007F">#Docker</text>

    <!-- Pill 3: Kubernetes -->
    <rect x="175" y="0" width="105" height="26" class="cls-pill-bg" stroke="#38BDF8"/>
    <text x="187" y="17" class="cls-pill-text" fill="#38BDF8">#Kubernetes</text>

    <!-- Pill 4: Python -->
    <rect x="290" y="0" width="80" height="26" class="cls-pill-bg" stroke="#22C55E"/>
    <text x="302" y="17" class="cls-pill-text" fill="#22C55E">#Python</text>

    <!-- Pill 5: Bash -->
    <rect x="380" y="0" width="65" height="26" class="cls-pill-bg" stroke="#64748B"/>
    <text x="392" y="17" class="cls-pill-text" fill="#CBD5E1">#Bash</text>

    <!-- Pill 6: Zabbix -->
    <rect x="455" y="0" width="75" height="26" class="cls-pill-bg" stroke="#E11D48"/>
    <text x="467" y="17" class="cls-pill-text" fill="#FB7185">#Zabbix</text>
  </g>

  <!-- Terminal Bottom Prompt (Properly Spaced) -->
  <g transform="translate(45, 210)">
    <text x="0" y="0" font-family="monospace" font-size="13" fill="#64748B">$ systemctl is-active infrastructure</text>
    <text x="310" y="0" font-family="monospace" font-size="13" fill="#22C55E">active (running)</text>
  </g>

  <!-- Outer Border -->
  <rect width="850" height="260" class="cls-border"/>
</svg>
