<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="850" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="60%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <!-- Cube 1 Gradients (Cyan) -->
    <linearGradient id="cubeTop1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <linearGradient id="cubeLeft1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#023E8A"/>
      <stop offset="100%" stop-color="#03045E"/>
    </linearGradient>
    <linearGradient id="cubeRight1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#001233"/>
      <stop offset="100%" stop-color="#000814"/>
    </linearGradient>

    <!-- Cube 2 Gradients (Blue) -->
    <linearGradient id="cubeTop2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="cubeLeft2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="cubeRight2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="ambientGlow" cx="75%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#080C16" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .cls-bg { fill: url(#bgGrad); rx: 14px; }
    .cls-border { fill: none; stroke: url(#borderGrad); stroke-width: 1.5; rx: 14px; }
    .cls-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 30px; fill: url(#textGrad); }
    .cls-sub { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #94A3B8; }
    .cls-badge-bg { fill: rgba(0, 240, 255, 0.08); stroke: rgba(0, 240, 255, 0.4); stroke-width: 1; rx: 10px; }
    .cls-badge-text { font-family: monospace; font-size: 11px; font-weight: 700; fill: #00F0FF; letter-spacing: 1.2px; }
    .cls-pill-bg { fill: #131E32; stroke: #233857; stroke-width: 1; rx: 6px; }
    .cls-pill-text { font-family: monospace; font-size: 11px; font-weight: 600; fill: #CBD5E1; }
    
    @keyframes float1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .anim-float1 { animation: float1 4s ease-in-out infinite; }
    .anim-float2 { animation: float2 3.5s ease-in-out infinite; }
    .anim-dot { animation: pulseDot 1.5s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="850" height="240" class="cls-bg"/>
  <rect width="850" height="240" fill="url(#ambientGlow)"/>

  <!-- 3D Perspective Grid -->
  <g stroke="#00F0FF" stroke-opacity="0.12" stroke-width="1">
    <line x1="425" y1="100" x2="0" y2="240"/>
    <line x1="425" y1="100" x2="120" y2="240"/>
    <line x1="425" y1="100" x2="240" y2="240"/>
    <line x1="425" y1="100" x2="360" y2="240"/>
    <line x1="425" y1="100" x2="480" y2="240"/>
    <line x1="425" y1="100" x2="600" y2="240"/>
    <line x1="425" y1="100" x2="720" y2="240"/>
    <line x1="425" y1="100" x2="850" y2="240"/>
    
    <line x1="280" y1="140" x2="570" y2="140"/>
    <line x1="180" y1="170" x2="670" y2="170"/>
    <line x1="80" y1="205" x2="770" y2="205"/>
  </g>

  <!-- 3D Isometric Floating Cube (Server Node) -->
  <g class="anim-float1">
    <g transform="translate(680, 45)">
      <polygon points="45,8 80,26 45,44 10,26" fill="url(#cubeTop1)"/>
      <polygon points="10,26 45,44 45,86 10,68" fill="url(#cubeLeft1)"/>
      <polygon points="45,44 80,26 80,68 45,86" fill="url(#cubeRight1)"/>
      <circle cx="45" cy="44" r="4" fill="#00F0FF" opacity="0.9"/>
    </g>
  </g>

  <!-- 3D Floating Cube 2 -->
  <g class="anim-float2">
    <g transform="translate(585, 95)">
      <polygon points="30,6 55,19 30,32 5,19" fill="url(#cubeTop2)"/>
      <polygon points="5,19 30,32 30,64 5,51" fill="url(#cubeLeft2)"/>
      <polygon points="30,32 55,19 55,51 30,64" fill="url(#cubeRight2)"/>
    </g>
  </g>

  <!-- Left Content: Status Badge -->
  <rect x="40" y="28" width="185" height="24" class="cls-badge-bg"/>
  <circle cx="53" cy="40" r="3.5" fill="#22C55E" class="anim-dot"/>
  <text x="65" y="44" class="cls-badge-text">SYSADMIN @ WORK</text>

  <!-- Left Content: Name & Title -->
  <text x="40" y="88" class="cls-title">TRẦN ĐĂNG QUANG</text>
  <text x="40" y="112" class="cls-sub">Linux &amp; System Administrator | Automation &amp; DevOps Enthusiast</text>

  <!-- Left Content: Tech Badges / Pills -->
  <g transform="translate(40, 130)">
    <rect x="0" y="0" width="70" height="24" class="cls-pill-bg" stroke="#00F0FF"/>
    <text x="12" y="16" class="cls-pill-text" fill="#00F0FF">#Linux</text>

    <rect x="80" y="0" width="85" height="24" class="cls-pill-bg" stroke="#3B82F6"/>
    <text x="92" y="16" class="cls-pill-text" fill="#3B82F6">#Sysadmin</text>

    <rect x="175" y="0" width="75" height="24" class="cls-pill-bg" stroke="#22C55E"/>
    <text x="187" y="16" class="cls-pill-text" fill="#22C55E">#Docker</text>

    <rect x="260" y="0" width="95" height="24" class="cls-pill-bg"/>
    <text x="272" y="16" class="cls-pill-text">#Kubernetes</text>

    <rect x="365" y="0" width="65" height="24" class="cls-pill-bg"/>
    <text x="377" y="16" class="cls-pill-text">#Bash</text>

    <rect x="440" y="0" width="75" height="24" class="cls-pill-bg"/>
    <text x="452" y="16" class="cls-pill-text">#Python</text>

    <rect x="525" y="0" width="75" height="24" class="cls-pill-bg"/>
    <text x="537" y="16" class="cls-pill-text">#Zabbix</text>
  </g>

  <!-- Terminal Bottom Prompt -->
  <g transform="translate(40, 185)">
    <text x="0" y="16" font-family="monospace" font-size="13" fill="#64748B">$ systemctl is-active infrastructure</text>
    <text x="270" y="16" font-family="monospace" font-size="13" fill="#22C55E">active (running)</text>
  </g>

  <!-- Outer Border -->
  <rect width="850" height="240" class="cls-border"/>
</svg>
